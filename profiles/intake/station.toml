# Intake station. The station name defaults to the hostname.

[[tile]]
id = "requests"
label = "IBP Requests"
description = "Look up and enter book requests"
command = ["ibp-kiosk-app", "requests"]

[[status]]
label = "Network"
command = ["ibp-kiosk-status", "network"]

[[status]]
label = "IBP server"
command = ["ibp-kiosk-status", "server"]

[[status]]
label = "Package printer"
command = ["ibp-kiosk-status", "printer-package"]

[[status]]
label = "Updates"
command = ["ibp-kiosk-status", "update"]
interval = 30

[[admin]]
id = "wifi"
label = "Wi-Fi"
command = ["ibp-kiosk-app", "wifi"]

[[admin]]
id = "print-diag"
label = "Printer check"
description = "Show what the label printer is doing"
command = ["ibp-kiosk-app", "print-diag"]
