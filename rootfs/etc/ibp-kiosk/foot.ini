# foot terminal for the IBP station's terminal tiles (Ship Individual, Ship
# Bulk, Wi-Fi, Printer check). ibp-kiosk-app runs foot with
# --config=/etc/ibp-kiosk/foot.ini --fullscreen. See foot.ini(5) (foot 1.21).

[main]
# Large enough to read from a standing position: about 150 columns on the
# 1920x1080 shipping laptops.
font=DejaVu Sans Mono:size=16

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no

# Nothing in the terminal may start another program: no new terminal window
# (a shell), no URL opener.
[key-bindings]
spawn-terminal=none
show-urls-launch=none
show-urls-copy=none
show-urls-persistent=none
minimize=none
maximize=none
fullscreen=none

[url]
launch=true
