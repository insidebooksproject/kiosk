# Closing the lid or pressing the power button shuts the station down (on
# battery or on the charger); it never suspends. Press the power button to
# start it again. A desktop with an external monitor counts as docked, and a
# lid closed while docked does nothing.
[Login]
HandlePowerKey=poweroff
HandleLidSwitch=poweroff
HandleLidSwitchExternalPower=poweroff
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
