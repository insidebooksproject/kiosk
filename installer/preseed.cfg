#### Debian 13 (trixie) preseed for an IBP station.
# build.sh fills in the @...@ placeholders and puts this file at the root of
# the installer's initrd, where debian-installer loads it automatically.

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network. "auto" takes the first interface with a link: a plugged-in
# Ethernet cable wins, otherwise the Wi-Fi below (when the build has one).
# The installed system is managed by NetworkManager; setup.sh installs it in
# late_command, before netcfg writes the target's network config.
d-i hw-detect/load_firmware boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/hostname string @HOSTNAME@
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string
d-i netcfg/target_network_config select nm_config
@WIFI@

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Accounts: no root password; "ibp" is the admin (sudo). setup.sh adds the
# passwordless "kiosk" user that runs the session.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string IBP admin
d-i passwd/username string ibp
d-i passwd/user-password-crypted password @ADMIN_PASSWORD_HASH@

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string America/Chicago
d-i clock-setup/ntp boolean true

# Disk: early.sh picks the one internal disk (and aborts unless there is
# exactly one), then the whole disk is wiped: GPT, an EFI partition and one
# ext4 root, no swap partition (setup.sh sets up zram instead).
d-i partman/early_command string sh /kiosk/installer/early.sh
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string                        \
      kiosk ::                                               \
              538 538 1075 free                              \
                      $iflabel{ gpt }                        \
                      $reusemethod{ }                        \
                      method{ efi }                          \
                      format{ } .                            \
              4096 10000 -1 ext4                             \
                      method{ format } format{ }             \
                      use_filesystem{ } filesystem{ ext4 }   \
                      mountpoint{ / }                        \
                      options/noatime{ noatime } .
d-i partman-auto/choose_recipe select kiosk
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

# Packages: a bare base system; setup.sh installs everything else
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# Boot loader. The extra removable-path copy (EFI/BOOT/BOOTX64.EFI) makes the
# disk bootable even if the firmware forgets its boot entries.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# Set up the station, then reboot without asking
d-i preseed/late_command string sh /kiosk/installer/late.sh
d-i finish-install/reboot_in_progress note
