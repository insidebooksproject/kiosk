# Boot menu for the USB stick (UEFI). build.sh fills in @HOSTNAME@. It
# waits for a keypress, so a machine that boots from the stick by accident
# never starts wiping a disk on its own.
set default=0
set timeout=-1

menuentry 'Install IBP station @HOSTNAME@ - ERASES the internal disk' {
    linux  /install.amd/vmlinuz priority=critical --- quiet
    initrd /install.amd/initrd.gz /kiosk/payload.cpio.gz
}

menuentry 'Debian rescue mode' {
    linux  /install.amd/vmlinuz rescue/enable=true --- quiet
    initrd /install.amd/initrd.gz
}
